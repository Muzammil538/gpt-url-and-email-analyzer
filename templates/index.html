<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PhishGuard Pro | AI Phishing Detector</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .gradient-bg { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        .spinner { animation: spin 1s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">
    <!-- Header -->
    <div class="gradient-bg py-12 px-4 sm:px-6 lg:px-8 shadow-lg">
        <div class="max-w-4xl mx-auto text-center">
            <h1 class="text-4xl font-extrabold text-white sm:text-5xl sm:tracking-tight lg:text-6xl">
                PhishGuard Pro
            </h1>
            <p class="mt-3 text-xl text-indigo-100">
                AI-powered protection against phishing attacks
            </p>
        </div>
    </div>

    <!-- Main Content -->
    <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <div class="bg-white shadow-xl rounded-lg overflow-hidden border border-gray-200">
            <!-- Input Section -->
            <div class="p-6 sm:p-8">
                <div class="mb-6">
                    <label for="email" class="block text-lg font-medium text-gray-800 mb-2">
                        Paste Email Content
                    </label>
                    <textarea 
                        id="email" 
                        rows="8" 
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-purple-500 transition duration-200"
                        placeholder="Example: 'Urgent! Your account will be suspended. Click here: http://fake-paypal.com'"
                        autofocus
                    ></textarea>
                </div>
                <button 
                    id="scan-btn"
                    onclick="scanEmail()" 
                    class="w-full bg-purple-600 hover:bg-purple-700 text-white font-bold py-3 px-4 rounded-lg transition duration-200 flex items-center justify-center"
                >
                    <span id="btn-text">Scan for Phishing</span>
                    <svg id="spinner" class="hidden w-5 h-5 ml-2 text-white spinner" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                </button>
            </div>

            <!-- Results Section -->
            <div id="results" class="hidden border-t border-gray-200 bg-gray-50 p-6 sm:p-8">
                <h2 class="text-2xl font-bold text-gray-900 mb-6">Scan Results</h2>
                
                <!-- Email Analysis -->
                <div class="mb-8">
                    <div class="flex items-center mb-3">
                        <svg class="w-6 h-6 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path>
                        </svg>
                        <h3 class="text-lg font-semibold text-gray-800">Email Analysis</h3>
                    </div>
                    <div id="email-result" class="p-4 rounded-lg bg-white border">
                        <!-- Dynamic content -->
                    </div>
                </div>

                <!-- URL Analysis -->
                <div>
                    <div class="flex items-center mb-3">
                        <svg class="w-6 h-6 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"></path>
                        </svg>
                        <h3 class="text-lg font-semibold text-gray-800">URL Analysis</h3>
                    </div>
                    <div id="url-list" class="p-4 rounded-lg bg-white border">
                        <!-- Dynamic content -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="mt-12 py-6 px-4 text-center text-gray-500 text-sm">
        <p>© 2023 PhishGuard Pro. Uses Qwen3 30B AI and Google Safe Browsing API.</p>
    </footer>

    <script>
        async function scanEmail() {
            const emailText = document.getElementById("email").value.trim();
            if (!emailText) {
                alert("Please paste email content to scan!");
                return;
            }

            // UI Loading State
            const btn = document.getElementById("scan-btn");
            const btnText = document.getElementById("btn-text");
            const spinner = document.getElementById("spinner");
            btn.disabled = true;
            btnText.textContent = "Analyzing...";
            spinner.classList.remove("hidden");

            // Show results section
            const resultsDiv = document.getElementById("results");
            resultsDiv.classList.remove("hidden");
            document.getElementById("email-result").innerHTML = `
                <div class="flex items-center">
                    <svg class="animate-spin -ml-1 mr-2 h-5 w-5 text-purple-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                    <span class="text-gray-700">Processing email content...</span>
                </div>
            `;
            document.getElementById("url-list").innerHTML = `
                <div class="flex items-center">
                    <svg class="animate-spin -ml-1 mr-2 h-5 w-5 text-purple-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                    <span class="text-gray-700">Checking URLs...</span>
                </div>
            `;

            try {
                const response = await fetch("/scan", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ email: emailText })
                });
                
                if (!response.ok) throw new Error("Server error");
                const data = await response.json();

                // Display email result
                const emailResult = data.phishing_email 
                    ? `
                        <div class="flex items-start">
                            <svg class="flex-shrink-0 h-5 w-5 text-red-500 mt-0.5 mr-2" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor">
                                <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd" />
                            </svg>
                            <div>
                                <p class="font-bold text-red-600">Phishing Detected!</p>
                                <p class="text-gray-700 mt-1">This email contains suspicious language commonly used in phishing attempts.</p>
                            </div>
                        </div>
                    `
                    : `
                        <div class="flex items-start">
                            <svg class="flex-shrink-0 h-5 w-5 text-green-500 mt-0.5 mr-2" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor">
                                <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd" />
                            </svg>
                            <div>
                                <p class="font-bold text-green-600">Safe Email</p>
                                <p class="text-gray-700 mt-1">No obvious phishing indicators detected in the email content.</p>
                            </div>
                        </div>
                    `;
                document.getElementById("email-result").innerHTML = emailResult;

                // Display URL results
                let urlResult;
                if (data.malicious_urls && data.malicious_urls.length > 0) {
                    urlResult = `
                        <div class="space-y-3">
                            <div class="flex items-start">
                                <svg class="flex-shrink-0 h-5 w-5 text-red-500 mt-0.5 mr-2" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor">
                                    <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd" />
                                </svg>
                                <div>
                                    <p class="font-bold text-red-600">Warning: Malicious URLs Found</p>
                                    <p class="text-gray-700 mt-1">These links are associated with known phishing or malware sites:</p>
                                </div>
                            </div>
                            <ul class="mt-2 space-y-2 pl-7">
                                ${data.malicious_urls.map(url => `
                                    <li class="text-gray-700">
                                        <a href="${url}" target="_blank" rel="noopener noreferrer" class="text-red-600 hover:underline break-all">${url}</a>
                                    </li>
                                `).join('')}
                            </ul>
                        </div>
                    `;
                } else {
                    const urlsFound = emailText.match(/https?:\/\/[^\s]+/g) || [];
                    if (urlsFound.length > 0) {
                        urlResult = `
                            <div class="flex items-start">
                                <svg class="flex-shrink-0 h-5 w-5 text-green-500 mt-0.5 mr-2" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor">
                                    <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd" />
                                </svg>
                                <div>
                                    <p class="font-bold text-green-600">All URLs Appear Safe</p>
                                    <p class="text-gray-700 mt-1">No malicious links detected in ${urlsFound.length} URL(s).</p>
                                </div>
                            </div>
                        `;
                    } else {
                        urlResult = `
                            <div class="text-gray-700">
                                No URLs found in this email.
                            </div>
                        `;
                    }
                }
                document.getElementById("url-list").innerHTML = urlResult;

            } catch (error) {
                console.error("Scan failed:", error);
                document.getElementById("email-result").innerHTML = `
                    <div class="text-red-600">
                        <p class="font-bold">Error:</p>
                        <p>${error.message || "Failed to analyze email"}</p>
                    </div>
                `;
                document.getElementById("url-list").innerHTML = `
                    <div class="text-red-600">
                        URL checking failed due to error.
                    </div>
                `;
            } finally {
                // Reset button
                btn.disabled = false;
                btnText.textContent = "Scan for Phishing";
                spinner.classList.add("hidden");
            }
        }

        // Auto-detect paste events
        document.getElementById("email").addEventListener("paste", function(e) {
            setTimeout(() => {
                const text = e.target.value;
                if (text.length > 50) {
                    scanEmail();
                }
            }, 100);
        });
    </script>
</body>
</html>
